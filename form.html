<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamal Mother Pitha</title>
    <style>
        .basic-info label { 
            display: block;
            margin-top: 10px;
        }
    </style>

</head>
<body>
    <header>
        <h2>Jamal Mother Pitha</h2>

    </header>

    <main>
        <form>
            <fieldset class="basic-info">
                <legend>Basic Information</legend>
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email">
            </fieldset>

            <fieldset class="basic-info">
                <legend>Pitha Information</legend>
                <input type="radio" name="Pitha" id="Bhapa">
                <label for="Bhapa">Bhapa Pitha</label>

                <input type="radio" name="Pitha" id="Chitoi">
                <label for="Chitoi">Chitoi Pitha</label>

                <input type="radio" name="Pitha" id="Pati">
                <label for="Pati">Pati Shapta</label>
            </fieldset>

            <fieldset class="basic-info">
                <legend>Quantity</legend>
                <input type="checkbox" name="quantity" id="alu">
                <label for="alu">Alu Pitha</label>

                <input type="checkbox" name="quantity" id="narikel">
                <label for="narikel">Narikel Pitha</label>

                <input type="checkbox" name="quantity" id="gud">
                <label for="gud">Gud Pitha</label>
            </fieldset>
            <fieldset>
                <legend>Info Checkbox</legend>
                <input type="checkbox" name="quantity" id="alu">
                <label for="alu">Alu Pitha</label>

                <input type="checkbox" name="quantity" id="narikel">
                <label for="narikel">Narikel Pitha</label>

                <input type="checkbox" name="quantity" id="gud">
                <label for="gud">Gud Pitha</label>
            </fieldset>



        </form>

    </main>
    <footer>

    </footer>
</body>
</html>
