<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Practice</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            

        }
        .box {
            border: 2px solid black;
            background-color: lightskyblue;
            height: 150px;
            width: 150px;
            font-size: 2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="box">user - 1</div>
            <div class="box">user - 2</div>
            <div class="box">user - 3</div>
            <div class="box">user - 4</div>
            <div class="box">user - 5</div>
            <div class="box">user - 6</div>
            <div class="box">user - 7</div>
            <div class="box">user - 8</div>
            <div class="box">user - 9</div>
            <div class="box">user - 10</div>
            <div class="box">user - 11</div>
            <div class="box">user - 12</div>
            <div class="box">user - 6</div>
            <div class="box">user - 7</div>
            <div class="box">user - 8</div>
            <div class="box">user - 9</div>
            <div class="box">user - 10</div>
            <div class="box">user - 11</div>
            <div class="box">user - 12</div>
        </div>
    </main>
</body>
</html>
