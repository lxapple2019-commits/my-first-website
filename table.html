<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Practice</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <header>
        <h2>Table Practice</h2>

    </header>
    <main>
        <table>
            <caption>Shopping List</caption>
            <thead>
                <tr>
                    <th>NO</th>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Apple</td>
                    <td>10</td>
                    <td>$1.00</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Banana</td>
                    <td>5</td>
                    <td>$0.50</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Orange</td>
                    <td>8</td>
                    <td>$0.80</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total</td>
                    <td>$10.00</td>
                </tr>
            </tfoot>
        </table>

    </main>
    <footer>

    </footer>
    
</body>
</html>
